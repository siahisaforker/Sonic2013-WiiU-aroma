name: Build Wii U WUHBs

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wiiu-wuhbs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Wii U toolchain image
        run: docker build -t sonic3air-wiiu -f Dockerfile.wiiu .

      - name: Build Wii U WUHB variants
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            sonic3air-wiiu \
            bash -lc 'python3 scripts/build.py all --out-dir /workspace/out'

      - name: Upload RPX/ELF artifacts for debugging
        uses: actions/upload-artifact@v4
        with:
          name: wiiu-rpx-elf
          path: |
            bin/RSDKv4.rpx
            bin/RSDKv4.elf
          if-no-files-found: warn

      - name: Upload Wii U WUHBs
        uses: actions/upload-artifact@v4
        with:
          name: wiiu-wuhbs
          path: out/*.wuhb
          if-no-files-found: error
