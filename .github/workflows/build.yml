name: Build Wii U WUHBs

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wiiu-wuhbs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ hashFiles('Dockerfile.wiiu') }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build Wii U toolchain image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.wiiu
          load: true
          tags: sonic3air-wiiu:latest
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Build Wii U WUHB variants
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            sonic3air-wiiu:latest \
            bash -lc 'python3 scripts/build.py all -j2 --out-dir /workspace/out'

      - name: Upload RPX/ELF artifacts for debugging
        uses: actions/upload-artifact@v4
        with:
          name: wiiu-rpx-elf
          path: |
            bin/RSDKv4.rpx
            bin/RSDKv4.elf
          if-no-files-found: warn

      - name: Upload Wii U WUHBs
        uses: actions/upload-artifact@v4
        with:
          name: wiiu-wuhbs
          path: out/*.wuhb
          if-no-files-found: error
